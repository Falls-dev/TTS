services:
  tts:
    container_name: tts
    build: ./tts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5003/health-check"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    volumes:
      - ./tts/persistent_data/tts_models:/root/tts_data
    # Раскомментируй, если есть NVIDIA GPU + nvidia-container-toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  tts-api:
    container_name: tts-api
    build: ./tts-api
    ports:
      - "5002:5002"
    restart: unless-stopped
    environment:
      TTS_AUTHORIZATION_TOKEN: ${TTS_AUTHORIZATION_TOKEN:-coolio}
      TTS_BACKEND_URL: http://tts:5003
    depends_on:
      tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5002/health-check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
